name: Phase 4 Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  phase4-foundation:
    name: Phase 4 Foundation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Foundation Tests
        run: |
          node --test tests/phase4-foundation.test.js

  phase4-integration:
    name: Phase 4 Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Integration Tests
        run: |
          node --test tests/phase4-integration.test.js

  phase4-regression:
    name: Phase 4 Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Regression Tests
        run: |
          node --test tests/phase4-regression.test.js
