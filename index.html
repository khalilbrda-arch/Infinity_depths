<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Infinite Depths — أعماق اللانهاية</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a1420;
    height: 100%;
    width: 100%;
  }
  #game-container {
    width: 100vw;
    height: 100vh;
  }
  #boot-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a1420;
    color: #8fd3ff;
    font-family: -apple-system, system-ui, sans-serif;
    z-index: 100;
  }
  #boot-screen h1 {
    font-size: 20px;
    letter-spacing: 2px;
    margin: 0 0 8px;
  }
  #boot-screen p {
    font-size: 12px;
    opacity: 0.6;
    margin: 0;
  }
  #debug-hud {
    position: fixed;
    top: 8px;
    left: 8px;
    color: #7fffb0;
    font-family: monospace;
    font-size: 11px;
    background: rgba(0,0,0,0.4);
    padding: 4px 8px;
    border-radius: 4px;
    z-index: 50;
    pointer-events: none;
  }
  #controls-hint {
    position: fixed;
    bottom: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: -apple-system, system-ui, sans-serif;
    color: #eaf4ff;
    font-size: 12px;
    opacity: 0.55;
    z-index: 45;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="boot-screen">
  <h1>INFINITE DEPTHS</h1>
  <p>جارِ تحميل العالم...</p>
</div>

<div id="debug-hud">FPS: --</div>
<div id="controls-hint">اسحب بإصبع للتحريك · إصبعين للتكبير · انقر على العناصر للتفاعل</div>
<div id="game-container"></div>

<!--
  رقم الإصدار "?v=6" يمنع المتصفح من استخدام نسخة قديمة محفوظة (Cache).
  عند تحديث أي ملف JS مستقبلاً، يكفي رفع هذا الرقم هنا فقط.
-->

<!-- Three.js Engine (r128، يبقى ثابت) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- الأساس (Core) -->
<script src="src/core/Config.js?v=6"></script>
<script src="src/core/GameState.js?v=6"></script>
<script src="src/core/Time.js?v=6"></script>

<!-- الواجهة (UI) — تُحمَّل مبكرًا لأن أنظمة أخرى قد تستخدمها -->
<script src="src/ui/Toast.js?v=6"></script>

<!-- العالم (World) -->
<script src="src/world/Ocean.js?v=6"></script>
<script src="src/world/Island.js?v=6"></script>
<script src="src/world/Interactables.js?v=6"></script>

<!-- الإدخال (Input) — v0.4: سحب وتكبير، + v0.5: كشف نقر (Tap) -->
<script src="src/input/TouchControls.js?v=6"></script>

<!-- الكاميرا (Camera) — v0.4: يحل محل نظام Player بالكامل -->
<script src="src/camera/CameraController.js?v=6"></script>

<!-- التفاعل (Interaction) — v0.5: يربط النقرة بعناصر الخريطة -->
<script src="src/interaction/InteractionController.js?v=6"></script>

<!-- محرك اللعبة الرئيسي (يُحمَّل أخيرًا لأنه يستخدم كل ما سبق) -->
<script src="src/core/Game.js?v=6"></script>

</body>
</html>
