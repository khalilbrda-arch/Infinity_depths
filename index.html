<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Infinite Depths — أعماق اللانهاية</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a1420;
    height: 100%;
    width: 100%;
  }
  #game-container {
    width: 100vw;
    height: 100vh;
  }
  #boot-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a1420;
    color: #8fd3ff;
    font-family: -apple-system, system-ui, sans-serif;
    z-index: 100;
  }
  #boot-screen h1 {
    font-size: 20px;
    letter-spacing: 2px;
    margin: 0 0 8px;
  }
  #boot-screen p {
    font-size: 12px;
    opacity: 0.6;
    margin: 0;
  }
  #debug-hud {
    position: fixed;
    top: 8px;
    left: 8px;
    color: #7fffb0;
    font-family: monospace;
    font-size: 11px;
    background: rgba(0,0,0,0.4);
    padding: 4px 8px;
    border-radius: 4px;
    z-index: 50;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="boot-screen">
  <h1>INFINITE DEPTHS</h1>
  <p>جارِ تحميل العالم...</p>
</div>

<div id="debug-hud">FPS: --</div>
<div id="game-container"></div>

<!-- Three.js Engine (r128, يبقى ثابت لبقية المشروع لتفادي كسر التوافق) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- الأساس (Core) -->
<script src="src/core/Config.js"></script>
<script src="src/core/GameState.js"></script>
<script src="src/core/Time.js"></script>

<!-- العالم (World) — المرحلة 2 -->
<script src="src/world/Ocean.js"></script>
<script src="src/world/Island.js"></script>

<!-- محرك اللعبة الرئيسي (يُحمَّل أخيرًا لأنه يستخدم كل ما سبق) -->
<script src="src/core/Game.js"></script>

</body>
</html>
